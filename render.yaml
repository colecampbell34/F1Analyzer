services:
  - type: web
    name: f1-analyzer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Keep one worker so the process-local response cache and rate limiter are
    # shared by all concurrent dashboard requests in this service instance.
    startCommand: gunicorn app:server --bind 0.0.0.0:$PORT --worker-class gthread --workers 1 --threads 4 --timeout 300 --graceful-timeout 30 --max-requests 200 --max-requests-jitter 25
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: ENABLE_BACKGROUND_PRELOAD
        value: "1"
